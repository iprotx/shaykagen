<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шайка детства | AI Transformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 20%, #2e1065 0%, #0c0a09 100%);
            background-attachment: fixed;
            color: white;
            overflow-x: hidden;
        }
        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        .text-neon {
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }
        .bg-blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--neon-purple) 0%, transparent 70%);
            filter: blur(100px);
            z-index: -1;
            animation: pulse-slow 10s infinite ease-in-out;
        }
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="min-h-screen">
    <div class="bg-blob top-0 left-0"></div>
    <div class="bg-blob bottom-0 right-0" style="animation-delay: -5s; background: radial-gradient(circle, var(--neon-pink) 0%, transparent 70%);"></div>
    
    <div id="root" class="relative z-10 w-full flex justify-center p-4 py-8 md:py-16"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
